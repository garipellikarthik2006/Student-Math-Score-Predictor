
<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <p class="subtitle">
        Enter student details to predict mathematics performance.
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/predict" method="POST">

        <label>Gender</label>
        <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Parental Level of Education</label>
        <select name="parent_education" required>
            <option value="bachelor's degree">Bachelor's Degree</option>
            <option value="some college">Some College</option>
            <option value="master's degree">Master's Degree</option>
            <option value="associate's degree">Associate's Degree</option>
            <option value="high school">High School</option>
            <option value="some high school">Some High School</option>
        </select>

        <label>Lunch Type</label>
        <select name="lunch" required>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free/Reduced</option>
        </select>

        <label>Test Preparation Course</label>
        <select name="preparation" required>
            <option value="completed">Completed</option>
            <option value="none">None</option>
        </select>

        <label>Reading Score</label>
        <input type="number"
               name="reading"
               min="0"
               max="100"
               required>

        <label>Writing Score</label>
        <input type="number"
               name="writing"
               min="0"
               max="100"
               required>

        <button type="submit">
            Predict Performance
        </button>

    </form>

    <a href="/history" class="history-link">
        View Previous Predictions
    </a>

</div>

</body>
</html>
